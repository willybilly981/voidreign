<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOIDREIGN - a duel of the empty court</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="fx"></canvas>
<div id="board" aria-live="polite">

  <header id="topbar">
    <div class="brand">VOIDREIGN</div>
    <div class="roundbox">
      <span id="round-no">ROUND I</span>
      <span class="sep">·</span>
      <span id="deck-count">18 cards remain</span>
    </div>
    <div class="scorebox">
      <div class="sigils" id="sigils-you" title="Your sigils"></div>
      <div class="sigil-label">FIRST TO THREE</div>
      <div class="sigils" id="sigils-herald" title="The Herald's sigils"></div>
    </div>
    <nav class="topbtns">
      <button id="btn-rules" class="tbtn" title="How to play">RULES</button>
      <button id="btn-sound" class="tbtn" title="Sound on/off">SOUND</button>
    </nav>
  </header>

  <section id="zone-herald" class="seatzone">
    <div class="who">
      <div class="who-name">THE HERALD</div>
      <div class="who-sub">Keeper of the Shattered Court</div>
      <div class="chips" id="chips-herald"></div>
    </div>
    <div class="seat-cards">
      <div class="handrow" id="herald-hand"></div>
      <div class="seat-mid">
        <div class="readline" id="herald-read"></div>
      </div>
      <div class="disrow" id="herald-discard"></div>
    </div>
  </section>

  <section id="zone-table">
    <div class="deckrow">
      <div id="deck-stack" title="The deck"></div>
      <div id="reborn-token" title="The Reborn card"></div>
    </div>
    <div class="blockwrap">
      <div id="block-slot"></div>
      <div id="prompt"></div>
    </div>
    <aside id="chronicle"><h3>CHRONICLE</h3><ul id="log"></ul></aside>
  </section>

  <section id="zone-you" class="seatzone">
    <div class="who">
      <div class="who-name">YOU <span class="heir">· HEIR OF THE COURT</span></div>
      <div class="who-sub">Deduce. Trade. Survive the burning.</div>
      <div class="chips" id="chips-you"></div>
    </div>
    <div class="seat-cards">
      <div class="disrow" id="you-discard"></div>
      <div class="handrow" id="you-hand"></div>
    </div>
  </section>

  <footer id="hintbar">Click a card to raise it, click again (or press 1-3) to play. Enter confirms overlays; Esc closes Rules.</footer>
</div>

<div id="overlay"></div>
<div id="rules-overlay"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
